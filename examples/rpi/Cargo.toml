[package]
name = "rpi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Print an sht-sensor serial number and status, then a reading every second."

[dependencies]
sht-sensor = { path = "../.." }
linux-embedded-hal = { version = "0.5.0", default-features = false, features = ["i2c"] }
