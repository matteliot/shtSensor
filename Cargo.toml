[package]
name = "sht-sensor"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Platform-agnostic, no_std driver for the Sensirion SHT3x-DIS (SHT30, SHT31, SHT35) temperature and humidity sensors, built on embedded-hal 1.0."
repository = "https://github.com/matteliot/shtSensor"
documentation = "https://docs.rs/sht-sensor"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["embedded-hal-driver", "sht30", "sht31", "sht35", "humidity"]
categories = ["embedded", "hardware-support", "no-std"]
exclude = [".github/"]

[features]
# Derive `defmt::Format` on the public types, for logging on microcontrollers.
defmt = ["dep:defmt"]

[dependencies]
embedded-hal = "1.0.0"
defmt = { version = "1.0", optional = true }

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1"] }
